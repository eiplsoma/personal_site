server {
    listen 80;
    server_name _;
    server_tokens off;
    # Redirects stay path-only: behind the reverse proxy nginx would otherwise
    # build an absolute Location from its own internal host:port.
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    # /site was the former address of the regular site (now served at /).
    # A permanent redirect, not a duplicate page, so search engines move the
    # old URL to / instead of seeing two competing versions.
    location ~ ^/site(?:\.html|/)?$ {
        return 301 /;
    }

    location = / {
        try_files /index.html =404;
    }

    # Next.js content-hashes every filename under _next/static/ (a changed
    # file gets a new name), so these can never go stale - safe to cache
    # for a year, per Next.js's own deployment guidance.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
