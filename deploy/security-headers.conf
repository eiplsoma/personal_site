# Baseline security headers, included by every location in nginx.conf. nginx
# drops inherited add_header directives as soon as a location defines its own
# (the Cache-Control ones, for instance), so this file is included explicitly
# in each location instead of relying on server-level inheritance.
#
# Defense in depth: Cloudflare sets the same headers at the edge; the origin
# repeats them so a request that reaches the container any other way is still
# covered. HSTS is intentionally left to the edge (the origin only speaks
# plain HTTP behind the reverse proxy, where the header has no effect).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
