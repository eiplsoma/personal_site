name: GHCR cleanup

on:
  schedule:
    - cron: '0 3 * * 0' # weekly, Sunday 03:00 UTC
  workflow_dispatch:

concurrency:
  group: ghcr-cleanup

jobs:
  prune:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Delete old personal_site package versions
        uses: dataaxiom/ghcr-cleanup-action@ac45a8c04b1eb4b27974ca79a0a74f344c93664b # v1.3.0
        with:
          keep-n-tagged: 10
          delete-untagged: true
          delete-orphaned-images: true
          dry-run: false
