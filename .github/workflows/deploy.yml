name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm exec eslint .

  build-and-push:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static export
        run: pnpm build

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/eiplsoma/personal_site:${{ github.sha }}
            ghcr.io/eiplsoma/personal_site:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cloudflared
        run: |
          curl -fsSL --proto '=https' --proto-redir '=https' --tlsv1.2 --retry 3 -o /usr/local/bin/cloudflared https://github.com/cloudflare/cloudflared/releases/download/2026.8.3/cloudflared-linux-amd64
          echo "f29324fe934d1e100617484c78deef803c4dc2cd351d645bbde42e96b4fccc5e  /usr/local/bin/cloudflared" | sha256sum -c -
          chmod +x /usr/local/bin/cloudflared

      - name: Set up SSH over Cloudflare Tunnel
        # Uses a dedicated tunnel hostname (ci-deploy.eiplsoma.hu) that has no
        # Cloudflare Access application/policy attached to it at all, unlike
        # the human-facing ssh.eiplsoma.hu. This deliberately avoids Cloudflare
        # Access entirely: mTLS auth is Business-plan-only, and Access Service
        # Tokens hit a confirmed cloudflared bug (cloudflare/cloudflared#1673)
        # where `access ssh`/`access tcp` ignores service-token credentials and
        # falls back to interactive browser auth. The real access control here
        # is the SSH key itself (same as any key-only-auth SSH host) — the
        # tunnel just avoids exposing port 22 on the VPS firewall directly.
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          (umask 077; printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key)
          echo "ci-deploy.eiplsoma.hu ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJMaOYsuKBX5ds4PtTwoayoSsvk7ggIaMJ8eWchJZb3l" > ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host vps
            HostName ci-deploy.eiplsoma.hu
            User $VPS_USER
            IdentityFile ~/.ssh/deploy_key
            ProxyCommand cloudflared access ssh --hostname %h
            StrictHostKeyChecking yes
          EOF
          chmod 600 ~/.ssh/config
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_USER: ${{ secrets.VPS_USER }}

      - name: Deploy on VPS
        # personal-site-deploy is now a forced-command key (authorized_keys
        # on the VPS runs /home/deploy/personal-site-deploy.sh regardless of
        # what's sent here) - the wrapper script extracts IMAGE_TAG from
        # $SSH_ORIGINAL_COMMAND (must be a 40-hex-char SHA, anything else is
        # rejected), then does the pull/up/prune/smoke-test itself. The
        # compose file is no longer scp'd per-deploy: it rarely changes and
        # scp can't work through a forced-command key anyway. A reference
        # copy stays at deploy/docker-compose.yml; copy it to the VPS by
        # hand if it changes (see docs/RUNBOOK.md-equivalent for this repo).
        env:
          IMAGE_SHA: ${{ github.sha }}
        run: |
          ssh vps "IMAGE_TAG=$IMAGE_SHA"
