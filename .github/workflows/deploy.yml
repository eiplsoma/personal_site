name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static export
        run: pnpm build

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/eiplsoma/personal_site:${{ github.sha }}
            ghcr.io/eiplsoma/personal_site:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cloudflared
        # Pinned to 2026.5.1, not latest: 2026.6.0+ has a confirmed regression
        # where `access ssh`/`access tcp` ignores service-token credentials
        # entirely and falls back to interactive browser auth on every
        # connection (cloudflare/cloudflared#1673). No fix exists yet upstream.
        run: |
          curl -sL -o /usr/local/bin/cloudflared https://github.com/cloudflare/cloudflared/releases/download/2026.5.1/cloudflared-linux-amd64
          echo "3c6a5ba995a258dbe90f98e5fdb2c2620b7be72c3ca761614f6eb52aee252cea  /usr/local/bin/cloudflared" | sha256sum -c -
          chmod +x /usr/local/bin/cloudflared

      - name: Set up SSH over Cloudflare Access
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "ssh.eiplsoma.hu ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJMaOYsuKBX5ds4PtTwoayoSsvk7ggIaMJ8eWchJZb3l" > ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<'EOF'
          Host vps
            HostName ssh.eiplsoma.hu
            User ${{ secrets.VPS_USER }}
            IdentityFile ~/.ssh/deploy_key
            ProxyCommand cloudflared access ssh --hostname %h
            StrictHostKeyChecking yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Copy compose file to VPS
        run: scp deploy/docker-compose.yml vps:~/personal-site/docker-compose.yml

      - name: Deploy on VPS
        run: |
          ssh vps 'set -e; cd ~/personal-site; echo "IMAGE_TAG=${{ github.sha }}" > .env; docker compose pull; docker compose up -d; docker image prune -f'

      - name: Smoke test
        run: |
          sleep 5
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://eiplsoma.hu/)
          echo "HTTP status: $status"
          if [ "$status" != "200" ]; then
            echo "Smoke test failed — site did not return 200, see docs/deploy-runbook.md"
            exit 1
          fi
